<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Требуй знания!</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { margin:0; font-family: sans-serif; background: #F4F2EC; color: #171A1F; overflow: hidden; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
  .btn { background: #EE4A18; color: white; padding: 15px 30px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; margin-top: 20px; cursor: pointer; }
  h1 { font-size: 24px; margin-bottom: 10px; }
  p { color: #787B82; line-height: 1.5; }
</style>
</head>
<body>

<div id="app">
  <h1>Ассаламу алейкум!</h1>
  <p>Приложение загружается...</p>
  <button class="btn" onclick="alert('JS работает!')">Проверить кнопку</button>
</div>

<script>
  // Если вы видите эту надпись и кнопка работает, значит проблема была в основном коде (он слишком большой и обрезался).
  console.log("Script loaded successfully");
  
  // Здесь должна быть инициализация Telegram
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }
</script>

</body>
</html>
