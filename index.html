<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F4F2EC">
<title>Требуй знания!</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--acc:#EE4A18;--bg:#F4F2EC;--card:#FFF;--ink:#171A1F;--ink2:#787B82;--line:rgba(0,0,0,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Golos Text',sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;height:100vh;display:flex;flex-direction:column}
#app{flex:1;overflow-y:auto;padding:20px;padding-bottom:80px}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-family:'Unbounded',sans-serif;font-size:22px;margin:0}
.btn{background:var(--acc);color:#fff;border:none;padding:12px 20px;border-radius:12px;font-weight:600;width:100%;margin-top:10px;cursor:pointer}
.card{background:var(--card);padding:16px;border-radius:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.row{display:flex;align-items:center;gap:12px}
.ic{width:40px;height:40px;background:rgba(238,74,24,.1);color:var(--acc);border-radius:10px;display:grid;place-items:center;font-size:20px}
.t{font-weight:600;font-size:16px}
.d{font-size:13px;color:var(--ink2);margin-top:4px}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);display:flex;padding:10px;border-top:1px solid var(--line)}
.tab{flex:1;text-align:center;font-size:11px;color:var(--ink2);cursor:pointer}
.tab.on{color:var(--acc);font-weight:700}
/* Стили плеера */
#player{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;flex-direction:column;padding:20px}
#player.on{display:flex}
.wave{height:60px;background:var(--card);border-radius:12px;margin:20px 0;display:flex;align-items:center;justify-content:center;gap:3px}
.bar{width:4px;background:var(--acc);border-radius:2px;animation:eq 1s infinite}
@keyframes eq{0%,100%{height:10px}50%{height:40px}}
</style>
</head>
<body>

<div id="app">
  <div class="hdr">
    <h1>Ассаламу алейкум</h1>
  </div>
  
  <div id="content">
    <!-- Сюда будет грузиться контент -->
  </div>
</div>

<div class="nav">
  <div class="tab on" onclick="render('home')">🏠 Главная</div>
  <div class="tab" onclick="render('lessons')">📚 Уроки</div>
  <div class="tab" onclick="render('books')">📖 Книги</div>
</div>

<div id="player">
  <div class="hdr"><button class="btn" style="width:auto;background:none;color:var(--ink)" onclick="closePlayer()">← Назад</button></div>
  <h2 id="p-title" style="text-align:center;margin-top:40px">Название урока</h2>
  <div class="wave">
    <div class="bar" style="animation-delay:0s"></div>
    <div class="bar" style="animation-delay:0.2s"></div>
    <div class="bar" style="animation-delay:0.4s"></div>
    <div class="bar" style="animation-delay:0.1s"></div>
    <div class="bar" style="animation-delay:0.3s"></div>
  </div>
  <button class="btn" onclick="togglePlay()">⏯ Играть / Пауза</button>
</div>

<script>
// --- ДАННЫЕ ---
const lessons = [
  {id:1, title:"Введение в курс", desc:"О чем мы будем говорить", dur:"05:00"},
  {id:2, title:"Основы вероубеждения", desc:"Первый столп", dur:"12:30"},
  {id:3, title:"Важность знания", desc:"Почему это важно", dur:"08:15"}
];

const books = [
  {id:1, title:"Хрестоматия", author:"Сборник статей"},
  {id:2, title:"Путь к знанию", author:"Ибн Сирин"}
];

let isPlaying = false;

// --- ЛОГИКА ---
function render(screen) {
  const c = document.getElementById('content');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  
  if(screen === 'home') {
    document.querySelectorAll('.tab')[0].classList.add('on');
    c.innerHTML = `
      <div class="card" style="background:var(--acc);color:white">
        <div style="font-size:14px;opacity:.8">Продолжить</div>
        <div style="font-size:18px;font-weight:bold;margin-top:5px">Урок 1: Введение</div>
        <button class="btn" style="background:white;color:var(--acc);margin-top:15px" onclick="openPlayer(1)">▶ Слушать</button>
      </div>
      <h3>Рекомендуемое</h3>
      ${lessons.slice(1).map(l => `
        <div class="card row" onclick="openPlayer(${l.id})">
          <div class="ic">🎧</div>
          <div><div class="t">${l.title}</div><div class="d">${l.dur}</div></div>
        </div>
      `).join('')}
    `;
  } 
  else if(screen === 'lessons') {
    document.querySelectorAll('.tab')[1].classList.add('on');
    c.innerHTML = `<h3>Все уроки</h3>` + lessons.map(l => `
      <div class="card row" onclick="openPlayer(${l.id})">
        <div class="ic">🎧</div>
        <div><div class="t">${l.title}</div><div class="d">${l.desc}</div></div>
      </div>
    `).join('');
  }
  else if(screen === 'books') {
    document.querySelectorAll('.tab')[2].classList.add('on');
    c.innerHTML = `<h3>Библиотека</h3>` + books.map(b => `
      <div class="card row">
        <div class="ic" style="background:rgba(14,75,61,.1);color:#0E4B3D">📖</div>
        <div><div class="t">${b.title}</div><div class="d">${b.author}</div></div>
      </div>
    `).join('');
  }
}

function openPlayer(id) {
  const l = lessons.find(x => x.id == id);
  document.getElementById('p-title').innerText = l.title;
  document.getElementById('player').classList.add('on');
  isPlaying = true;
}

function closePlayer() {
  document.getElementById('player').classList.remove('on');
  isPlaying = false;
}

function togglePlay() {
  isPlaying = !isPlaying;
  alert(isPlaying ? "Играет..." : "Пауза");
}

// Запуск
if(window.Telegram && window.Telegram.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}
render('home');
</script>
</body>
</html>
